<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cadastro de Empresas | FomeOff</title>
        <link rel="stylesheet" type="text/css" href="../css/index.css" />
    </head>
    <body>
        <div class="container-principal">
            <div class="formulario">
                <form method="post" action="../php/cadastrarEmpresa.php">
                    <input type="text" name="nome" placeholder="Empresa" required minlength="3" maxlength="100" />
                    <input type="text" name="cnpj" placeholder="CNPJ" required minlength="3" maxlength="20" />
                    <input type="text" name="cep" placeholder="CEP" required minlength="3" maxlength="10" />
                    <input type="email" name="email" placeholder="Email" required minlength="3" maxlength="100" />
                    <input type="password" name="senha" placeholder="Senha" required minlength="3" maxlength="8" />
                    <input type="submit" value="Cadastrar" />
                </form>
            </div>
        </div>
    </body>
</html>
